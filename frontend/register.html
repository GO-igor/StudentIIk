            <div class="rg-input lg-pass"><svg class="rg-icon" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 15H25.5C27.1569 15 28.5 16.3431 28.5 18V28.5C28.5 30.1569 27.1569 31.5 25.5 31.5H10.5C8.84315 31.5 7.5 30.1569 7.5 28.5V18C7.5 16.3431 8.84315 15 10.5 15Z"/><path d="M12 15V10.5C12 8.9087 12.6321 7.38258 13.7574 6.25736C14.8826 5.13214 16.4087 4.5 18 4.5C19.5913 4.5 21.1174 5.13214 22.2426 6.25736C23.3679 7.38258 24 8.9087 24 10.5V15M18 21V25.5"/></svg><input id="password2" type="password" autocomplete="new-password" placeholder="тот же пароль ещё раз"><button class="lg-eye" type="button" data-for="password2" aria-label="Показать пароль" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div>
          </div>
        </div>

        <button class="lg-btn lg-primary rg-submit" id="submit" type="button">Зарегистрироваться</button>
        <p class="rg-notice" id="notice" role="status" hidden>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
          <span>Регистрация пока не работает: это образец страницы.</span>
        </p>
      </form>

      <p class="lg-alt">Уже есть аккаунт? <a href="/login">Войти</a></p>
    </section>
  </main>
